<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#E9EFEC; --paper:#F4F7F5; --walk:#FFFFFF; --ink:#16232A; --muted:#617078; --line:#DCE3E1;
  --sheet:#FFFFFF; --sheet-2:#F3F6F5; --shadow:0 -6px 30px rgba(16,40,44,.16); --float:0 6px 20px rgba(16,40,44,.16);
  --accent:#0B7A75; --accent-ink:#FFFFFF; --accent-soft:#DDF1EF; --warm:#F2A93B; --warm-ink:#5E3C00; --here:#2F6BFF;
  --map-ink:#2A3A42; --map-stroke:rgba(20,40,50,.16);
  --c-office:#E8ECF4; --c-lab:#D3E7FA; --c-class:#E5DEFA; --c-lecture:#DAD0F7; --c-aud:#F7D8E5; --c-library:#CDEEDC;
  --c-prayer:#FBEABD; --c-court:#DDEFD0; --c-svc:#E3E6E8; --c-wc:#FFDFBD; --c-stair:#D2EED5; --c-elev:#FAD2CE;
  --c-meet:#FCE5CE; --c-fac:#FBE0A2; --c-roof:#EEF1F2;
  --font:'Readex Pro','Segoe UI',Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1618; --paper:#131D20; --walk:#1E2B2F; --ink:#E6EEF0; --muted:#94A6AD; --line:#27363B;
  --sheet:#172226; --sheet-2:#1E2B30; --shadow:0 -6px 30px rgba(0,0,0,.5); --float:0 6px 20px rgba(0,0,0,.45);
  --accent:#4FC7BE; --accent-ink:#062724; --accent-soft:#16383A; --warm:#F2B55A; --warm-ink:#2E1D00; --here:#6E9BFF;
  --map-ink:#D8E3E6; --map-stroke:rgba(255,255,255,.10);
  --c-office:#233038; --c-lab:#1B3347; --c-class:#2C2745; --c-lecture:#322859; --c-aud:#462536; --c-library:#1A3B2E;
  --c-prayer:#44391A; --c-court:#20351C; --c-svc:#252C30; --c-wc:#4A3218; --c-stair:#1D3A24; --c-elev:#4A2220;
  --c-meet:#44301C; --c-fac:#5B4516; --c-roof:#1A2427;
}}
:root[data-theme="dark"]{
  --bg:#0E1618; --paper:#131D20; --walk:#1E2B2F; --ink:#E6EEF0; --muted:#94A6AD; --line:#27363B;
  --sheet:#172226; --sheet-2:#1E2B30; --shadow:0 -6px 30px rgba(0,0,0,.5); --float:0 6px 20px rgba(0,0,0,.45);
  --accent:#4FC7BE; --accent-ink:#062724; --accent-soft:#16383A; --warm:#F2B55A; --warm-ink:#2E1D00; --here:#6E9BFF;
  --map-ink:#D8E3E6; --map-stroke:rgba(255,255,255,.10);
  --c-office:#233038; --c-lab:#1B3347; --c-class:#2C2745; --c-lecture:#322859; --c-aud:#462536; --c-library:#1A3B2E;
  --c-prayer:#44391A; --c-court:#20351C; --c-svc:#252C30; --c-wc:#4A3218; --c-stair:#1D3A24; --c-elev:#4A2220;
  --c-meet:#44301C; --c-fac:#5B4516; --c-roof:#1A2427;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- map */
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--paper);user-select:none;-webkit-user-select:none}
.r{stroke:var(--map-stroke);stroke-width:2;stroke-linejoin:round;cursor:pointer}
.r.office{fill:var(--c-office)}.r.lab{fill:var(--c-lab)}.r.class{fill:var(--c-class)}.r.lecture{fill:var(--c-lecture)}.r.aud{fill:var(--c-aud)}
.r.library{fill:var(--c-library)}.r.prayer{fill:var(--c-prayer)}.r.court{fill:var(--c-court)}.r.svc{fill:var(--c-svc)}.r.wc,.r.vest{fill:var(--c-wc)}
.r.stair{fill:var(--c-stair)}.r.elev{fill:var(--c-elev)}.r.meet{fill:var(--c-meet)}.r.entry{fill:var(--walk);stroke:none}.r.fac{fill:var(--c-fac)}
.r.void{fill:transparent;stroke:var(--map-stroke);stroke-dasharray:10 8;cursor:default}
.r.sel{stroke:var(--accent);stroke-width:8}
.r.hit{stroke:var(--accent);stroke-width:6}
.r.dim{opacity:.35}
.walk{fill:var(--walk)}
.roof{fill:var(--c-roof)}
.t{pointer-events:none;fill:var(--map-ink);text-anchor:middle;dominant-baseline:central;font-family:var(--font)}
.t.n{font-weight:500;opacity:.75}
.ic{pointer-events:none}
.here-pulse{fill:var(--here);opacity:.25;transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.4);opacity:.45}100%{transform:scale(1.6);opacity:0}}

/* ---------- floating chrome */
.top{position:fixed;inset-inline:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 0;display:flex;flex-direction:column;gap:10px;pointer-events:none;z-index:10}
.top > *{pointer-events:auto}
.searchrow{display:flex;gap:8px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:10px;height:52px;border-radius:26px;background:var(--sheet);box-shadow:var(--float);padding-inline:18px 8px}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;font-size:16px;outline:none;height:100%}
.search input::placeholder{color:var(--muted)}
.clear{border:0;background:var(--sheet-2);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;color:var(--muted)}
.round{flex:none;width:52px;height:52px;border-radius:50%;border:0;background:var(--sheet);box-shadow:var(--float);font-weight:700;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:4px 12px;margin-block:-4px -12px;margin-inline:-12px;padding-inline:12px;overscroll-behavior-x:contain;-webkit-mask-image:linear-gradient(to var(--fade-dir,right),#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to var(--fade-dir,right),#000 calc(100% - 28px),transparent)}
[dir="rtl"] .chips{--fade-dir:left}
.chips.at-end{-webkit-mask-image:none;mask-image:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;height:40px;padding-inline:14px 16px;border-radius:20px;border:0;background:var(--sheet);box-shadow:var(--float);font-size:14px;font-weight:500;white-space:nowrap}
.chip .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.floors{position:fixed;inset-inline-end:12px;top:calc(env(safe-area-inset-top,0px) + 150px);display:flex;flex-direction:column;background:var(--sheet);border-radius:18px;box-shadow:var(--float);padding:5px;gap:4px;z-index:9}
.floors button{width:46px;height:46px;border-radius:14px;border:0;background:none;font-weight:700;font-size:17px;color:var(--muted);position:relative}
.floors button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.floors .you{position:absolute;inset-inline-start:-4px;top:-2px;width:12px;height:12px;border-radius:50%;background:var(--here);border:2px solid var(--sheet)}
.floors small{display:block;font-size:10px;text-align:center;color:var(--muted);padding-top:2px}
.locate{position:fixed;inset-inline-end:12px;z-index:9;width:52px;height:52px;border-radius:50%;border:0;background:var(--sheet);box-shadow:var(--float);display:grid;place-items:center;color:var(--here);transition:bottom .25s}

/* ---------- bottom sheet */
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:20;background:var(--sheet);border-radius:24px 24px 0 0;box-shadow:var(--shadow);height:88vh;height:88dvh;transform:translateY(calc(100% - var(--peek,190px)));transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.dragging{transition:none}
.grab{flex:none;padding:10px 0 6px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab i{width:44px;height:5px;border-radius:3px;background:var(--line)}
.sc{flex:1;overflow:auto;padding:4px 18px 24px;overscroll-behavior:contain}
.sheet h2{font-size:21px;line-height:1.3;margin:0;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
.pillrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.pill{font-size:12px;font-weight:600;border-radius:12px;padding:2px 10px;background:var(--sheet-2);color:var(--muted)}
.pill.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;color:var(--ink)}
.pill.here{background:var(--here);color:#fff}
.sec{margin-top:18px}
.sec h3{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px}
.list{display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:0;background:none;padding:10px 6px;border-radius:14px}
.item:active,.item:hover{background:var(--sheet-2)}
.item .ico{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.item .tx{flex:1;min-width:0}
.item b{display:block;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{color:var(--muted);font-size:13px}
.item .chev{color:var(--muted);font-size:18px}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:16px;padding:12px 14px;margin-top:14px;font-size:14px}
.hint .ico{flex:none;width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.cta{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--accent-ink);background:var(--accent);border-radius:16px;padding:14px 16px;margin-top:12px;font-weight:600}
.cta.alt{background:var(--sheet-2);color:var(--ink)}
.cta span.g{margin-inline-start:auto;font-size:18px}
.person{background:var(--sheet-2);border-radius:18px;padding:14px;margin-top:12px;display:flex;gap:12px;align-items:flex-start}
.avatar{flex:none;width:48px;height:48px;border-radius:50%;background:var(--warm);color:var(--warm-ink);display:grid;place-items:center;font-weight:700;font-size:18px}
.person h4{margin:0;font-size:16px;line-height:1.35}
.person p{margin:2px 0 0;color:var(--muted);font-size:13px}
.person .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.person .links a{font-size:13px;font-weight:600;text-decoration:none;border-radius:12px;padding:7px 12px;background:var(--sheet);color:var(--accent)}
.person .links a.p{background:var(--accent);color:var(--accent-ink)}
.empty{color:var(--muted);padding:12px 0}
.proto{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 126px);inset-inline-start:12px;font-size:11px;font-weight:600;background:var(--warm);color:var(--warm-ink);border-radius:10px;padding:2px 8px;pointer-events:none}

/* ---------- wide screens: sheet becomes a floating side card */
/* ---------- routes */
button.cta{border:0;width:100%;font:inherit;text-align:start;cursor:pointer}
body.picking #map{cursor:crosshair}
.route-case,.route-line,.route-flow{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.route-case{stroke:#fff;stroke-width:12}
.route-line{stroke:var(--here);stroke-width:7}
.route-flow{stroke:#fff;stroke-width:2.5;stroke-dasharray:1 13;animation:flow 1.1s linear infinite;opacity:.9}
@keyframes flow{to{stroke-dashoffset:-14}}
.go{cursor:pointer}
.warn{background:var(--warm);color:var(--warm-ink);border-radius:12px;padding:8px 12px;font-size:14px;margin:10px 0 0}
.summary{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:600;color:var(--ink)}
.summary span:first-child{color:var(--here);display:grid}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.modes button{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--sheet);border-radius:16px;padding:10px 12px;text-align:start;color:var(--ink);font:inherit;cursor:pointer}
.modes button[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.modes .mi{flex:none;display:grid;color:var(--accent)}
.modes b{display:block;font-size:14px;font-weight:600}
.modes small{color:var(--muted);font-size:13px}
.steps{list-style:none;margin:0;padding:0}
.steps li{position:relative}
.steps li:not(:last-child)::after{content:'';position:absolute;inset-inline-start:21px;top:44px;bottom:-4px;width:2px;background:var(--line);border-radius:1px}
.steps button{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:start;border:0;background:none;padding:6px 4px;border-radius:12px;font:inherit;font-size:15px;line-height:1.5;color:var(--ink);cursor:pointer}
.steps button:hover,.steps button:active{background:var(--sheet-2)}
.sico{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--sheet-2);color:var(--ink)}
.sico.start{background:var(--here);color:#fff}
.sico.arrive{background:var(--accent);color:var(--accent-ink)}
.sico.stair{background:var(--c-stair);color:var(--map-ink)}
.sico.elev{background:var(--c-elev);color:var(--map-ink)}
.stx{padding-top:5px;min-width:0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.actions .cta{justify-content:center;padding:12px}
@media (min-width: 900px){
  .top{inset-inline-end:12px;width:auto}
  .top .searchrow{width:416px;max-width:100%}
  .chips{width:max-content;max-width:100%;margin-inline:-12px 0;-webkit-mask-image:none;mask-image:none}
  .sheet{inset-inline-start:12px;inset-inline-end:auto;width:420px;top:176px;bottom:12px;height:auto;border-radius:24px;transform:none!important}
  .grab{display:none}
  .locate{bottom:24px!important}
  .proto{top:auto;bottom:18px;inset-inline-start:auto;inset-inline-end:80px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>

// ---------- data
const ROOMS={}; const byRoom={};
PEOPLE.forEach(p=>(byRoom[p.room] ||= []).push(p));
FLOORS.forEach(f=>f.rooms.forEach(r=>{ if(!r.id.includes('~')){ const b=bbox(r.poly); ROOMS[r.id]={r,f,b}; } }));
function bbox(p){ let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9; for(const [x,y] of p){ x1=Math.min(x1,x);y1=Math.min(y1,y);x2=Math.max(x2,x);y2=Math.max(y2,y);} return {x1,y1,x2,y2,w:x2-x1,h:y2-y1,cx:(x1+x2)/2,cy:(y1+y2)/2}; }
const fac=id=>byRoom[id]||[];
const pname=p=>(lang==='ar'?(p.name_ar||p.name_en):(p.name_en||p.name_ar))||'';
const rname=r=>(lang==='ar'?(r.ar||r.en):(r.en||r.ar))||T[lang].cats[r.cat]||'';
const titleOf=id=>{ const {r}=ROOMS[id]; const ps=fac(id); return ps.length?pname(ps[0]):rname(r); };
const fIdx=k=>FLOORS.findIndex(f=>f.key===k);

// ---------- map drawing
const svg=document.getElementById('map');
let hereG=null, SCALED=[]; let fi=here?fIdx(here.floor):0, vb=null, selId=null, hits=new Set(), labels=[];
function el(tag,a,p){ const e=document.createElementNS(NS,tag); for(const k in a) e.setAttribute(k,a[k]); p&&p.appendChild(e); return e; }
const pts=p=>p.map(q=>q.join(',')).join(' ');
const measure=document.createElement('canvas').getContext('2d');
const tw=(s,fs,w=600)=>{ measure.font=`${w} ${fs}px 'Readex Pro', sans-serif`; return measure.measureText(s).width; };

function draw(){
  const f=FLOORS[fi]; svg.textContent=''; labels=[]; SCALED=[];
  (f.roof||[]).forEach(p=>el('polygon',{points:pts(p),class:'roof'},svg));
  const w=el('g',{class:'walk','stroke-linejoin':'round'},svg);
  f.circ.forEach(p=>el('polygon',{points:pts(p),stroke:'var(--walk)','stroke-width':6},w));
  const g=el('g',{},svg), lg=el('g',{},svg);
  f.rooms.forEach(r=>{
    const id=r.id.split('~')[0], has=fac(id).length>0;
    const cls=['r', has?'fac':r.cat]; if(id===selId) cls.push('sel'); if(hits.has(id)) cls.push('hit'); if(hits.size && !hits.has(id) && r.cat!=='entry') cls.push('dim');
    el('polygon',{points:pts(r.poly),class:cls.join(' '),'data-id':id,rx:8},g);
    if(r.id.includes('~')) return;
    const b=ROOMS[id].b;
    // icon for key categories
    const ik = has?'fac':({wc:'wc',prayer:'prayer',library:'library',elev:'elev',stair:'stair',aud:'aud'})[r.cat];
    if(ik){ const s=Math.min(b.w,b.h)*0.5, S=Math.max(26,Math.min(s,64));
      const u=el('g',{class:'ic',transform:`translate(${b.cx-S/2},${b.cy-S/2}) scale(${S/24})`,color:r.cat==='elev'?'#B3261E':'var(--map-ink)',opacity:.8},lg); u.innerHTML=IC[ik];
      labels.push({node:u,min:0,kind:'icon',b}); }
    if(['stair','elev','vest','void','entry'].includes(r.cat)) return;
    const name=has?pname(fac(id)[0]):rname(r); const num=(r.num||'').replace(f.prefix,'');
    let fs=Math.min(30,b.h*.28); const lines=[name];
    while(fs>8 && tw(name,fs)>b.w-10){ fs-=1; }
    const y0 = ik? b.cy + Math.min(b.h*.22, 34) : b.cy - (num?fs*.35:0);
    if(name && fs>8){ const tx=el('text',{x:b.cx,y:y0,'font-size':fs,'font-weight':has?700:600,class:'t'},lg); tx.textContent=name; labels.push({node:tx,min:fs,kind:'name'}); }
    if(num){ const nfs=Math.max(8,Math.min(fs*.75,20,(b.w-6)/(num.length*.6))); const tx=el('text',{x:b.cx,y:y0+fs*.55+nfs*.7,'font-size':nfs,class:'t n'},lg); tx.textContent=num; labels.push({node:tx,min:nfs,kind:'num'}); }
  });
  // you are here (drawn in screen pixels, rescaled on every zoom)
  hereG=null;
  drawRoute(f);
  if(DEBUG) drawDebug(f);
  if(here && here.floor===f.key){ hereG=el('g',{'pointer-events':'none'},svg);
    el('circle',{cx:0,cy:0,r:30,class:'here-pulse'},hereG);
    el('circle',{cx:0,cy:0,r:9,fill:'var(--here)',stroke:'#fff','stroke-width':3},hereG);
    const txt=t('here'); const fw=tw(txt,13,700)+22;
    el('path',{d:`M${-fw/2} -46 h${fw} a4 4 0 0 1 4 4 v18 a4 4 0 0 1 -4 4 h${-fw/2+6} l-6 7 l-6 -7 h${-fw/2+6} a4 4 0 0 1 -4 -4 v-18 a4 4 0 0 1 4 -4z`,fill:'var(--here)'},hereG);
    const tx=el('text',{x:0,y:-33,'font-size':13,'font-weight':700,fill:'#fff','text-anchor':'middle','dominant-baseline':'central'},hereG); tx.textContent=txt; }

// show labels only when they'd be readable on screen
function updateLabels(){ const px=svg.clientWidth/vb.w; if(hereG) hereG.setAttribute('transform',`translate(${here.x},${here.y}) scale(${1/px})`); SCALED.forEach(m=>m.g.setAttribute('transform',`translate(${m.x},${m.y}) scale(${1/px})`)); labels.forEach(l=>{ const on = l.kind==='icon' ? true : l.min*px>=8.5; l.node.style.display=on?'':'none'; }); }

// ---------- pan / zoom
function fit(){ const f=FLOORS[fi]; const W=svg.clientWidth, H=svg.clientHeight; const s=Math.max(f.w/W,f.h/(H*0.62)); vb={w:W*s,h:H*s}; vb.x=f.w/2-vb.w/2; vb.y=f.h/2-vb.h*0.44; apply(); }
function fitIds(ids){ const f=FLOORS[fi]; const bs=ids.map(id=>ROOMS[id]).filter(R=>R&&R.f===f).map(R=>R.b); if(!bs.length) return;
  let x1=Math.min(...bs.map(b=>b.x1),here&&here.floor===f.key?here.x:1e9), x2=Math.max(...bs.map(b=>b.x2),here&&here.floor===f.key?here.x:-1e9), y1=Math.min(...bs.map(b=>b.y1),here&&here.floor===f.key?here.y:1e9), y2=Math.max(...bs.map(b=>b.y2),here&&here.floor===f.key?here.y:-1e9);
  const W=svg.clientWidth,H=svg.clientHeight, wide=W>=900, visH=wide?H:H*0.42, top=wide?0:H*0.17, pad=150;
  const s=Math.max((x2-x1+pad*2)/(wide?W*0.6:W),(y2-y1+pad*2)/visH,350/W); vb={w:W*s,h:H*s};
  vb.x=(x1+x2)/2-vb.w/2-(wide?vb.w*0.15*(lang==='ar'?-1:1):0); vb.y=(y1+y2)/2-(top+visH/2)*s; apply(); }
function apply(){ svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`); updateLabels(); }
function focus(x,y,w){ const W=svg.clientWidth,H=svg.clientHeight; const wide=W>=900; vb={w, h:w*H/W}; vb.x=x-vb.w/2 - (wide? vb.w*0.18*(lang==='ar'?-1:1):0); vb.y=y-vb.h*(wide?0.5:0.36); apply(); }

svg.addEventListener('wheel',e=>{ e.preventDefault(); const [x,y]=toSvg(e.clientX,e.clientY); zoomAt(e.deltaY>0?1.15:1/1.15,x,y); },{passive:false});
const P=new Map(); let moved=0, pinch=null, lastTap=0;
svg.addEventListener('pointerdown',e=>{ svg.setPointerCapture(e.pointerId); P.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=0; if(P.size===2){ const [a,b]=[...P.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),w:vb.w}; } });
svg.addEventListener('pointermove',e=>{ if(!P.has(e.pointerId)) return; const p=P.get(e.pointerId), r=svg.getBoundingClientRect();
  if(P.size===1){ moved+=Math.abs(e.clientX-p.x)+Math.abs(e.clientY-p.y); if(moved>5){ vb.x-=(e.clientX-p.x)/r.width*vb.w; vb.y-=(e.clientY-p.y)/r.height*vb.h; apply(); } }
  P.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(P.size===2&&pinch){ const [a,b]=[...P.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); const [cx,cy]=toSvg((a.x+b.x)/2,(a.y+b.y)/2); zoomAt(pinch.w*pinch.d/d/vb.w,cx,cy); moved=99; } });
const up=e=>{ const tap=moved<=5&&P.size===1; P.delete(e.pointerId); if(P.size<2) pinch=null;
  if(tap&&e.type==='pointerup'){ const now=Date.now(); const [x,y]=toSvg(e.clientX,e.clientY);
    if(picking){ pickAt(x,y,e.clientX,e.clientY); lastTap=0; return; }
    if(now-lastTap<300){ zoomAt(1/1.8,x,y); lastTap=0; return; } lastTap=now;
    const n=document.elementFromPoint(e.clientX,e.clientY), id=n&&n.getAttribute&&n.getAttribute('data-id');

// ---------- search
const q=document.getElementById('q'), qc=document.getElementById('qclear');
const norm=s=>(s||'').toLowerCase().normalize('NFKD').replace(/[ً-ٰٟ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/^(dr\.?|د\.?)\s*/,'').trim();
let st; q.addEventListener('input',()=>{ qc.hidden=!q.value; clearTimeout(st); st=setTimeout(search,120); });
qc.onclick=()=>{ q.value=''; qc.hidden=true; clearHits(); };
q.addEventListener('focus',()=>{ if(window.innerWidth<900) setSheet('half'); });
function search(){ const s=norm(q.value); chipOn=null; drawChips(); if(!s){ hits=new Set(); home(); return; } route=null;
  const out=[];
  for(const id in ROOMS){ const {r,f}=ROOMS[id]; if(['stair','elev','vest','void'].includes(r.cat) || (r.cat==='entry'&&!r.ar)) continue;
    const ps=fac(id); const hay=[r.num, (r.num||'').replace(f.prefix,''), r.en, r.ar, ...ps.flatMap(p=>[p.name_ar,p.name_en,p.dept,p.email])].map(norm);
    const score = hay.some(x=>x===s)?0 : ps.some(p=>[p.name_ar,p.name_en].map(norm).some(x=>x.includes(s)))?1 : hay.slice(0,2).some(x=>x.startsWith(s))?2 : (s.length>2&&hay.some(x=>x.includes(s)))?3 : 9;
    if(score<9) out.push([score,id]); }
  out.sort((a,b)=>a[0]-b[0]||dist(a[1])-dist(b[1])); const ids=out.slice(0,80).map(x=>x[1]);
  hits=new Set(ids); if(ids.length && !ids.some(id=>ROOMS[id].f===FLOORS[fi])){ fi=FLOORS.indexOf(ROOMS[ids[0]].f); vb=null; drawFloors(); }
  draw(); listResults(ids, `“${q.value.trim()}”`); fitIds(ids);
  if(ids.length===1) openRoom(ids[0],true); }
q.addEventListener('keydown',e=>{ if(e.key==='Enter'){ q.blur(); } });

function backHere(){ if(!here){ startPick(null); return; } selId=null; route=null; hits=new Set(); chipOn=null; q.value=''; qc.hidden=true; drawChips();
  if(fi!==fIdx(here.floor)){ fi=fIdx(here.floor); drawFloors(); } draw(); focus(here.x,here.y,1100); home(); setSheet('peek'); }
document.getElementById('locate').onclick=backHere;

// ---------- language
function applyLang(){ document.documentElement.lang=lang; document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  q.placeholder=t('q'); document.getElementById('lang').textContent=t('lang'); document.getElementById('proto').textContent=t('proto');
  drawChips(); drawFloors(); if(picking) pickView(); else if(route) routeView(); else if(selId) openRoom(selId,false); else if(q.value) search(); else home(); }
document.getElementById('lang').onclick=()=>{ lang=lang==='ar'?'en':'ar'; try{ localStorage.setItem('ccw-lang',lang); }catch(e){} applyLang(); };

// ---------- boot: open at "you are here"
applyLang(); if(here) focus(here.x,here.y,1100); else fitFloor(); setSheet('peek');
setTimeout(()=>{ ROUTABLE.forEach(k=>net(k)); if(DEBUG) draw(); },300);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ draw(); });
})();
</script>

(function(){var c=document.getElementById("chips");if(!c)return;function upd(){var m=c.scrollWidth-c.clientWidth;c.classList.toggle("at-end",m<=2||Math.abs(c.scrollLeft)>=m-2);}c.addEventListener("scroll",upd,{passive:true});window.addEventListener("resize",upd);new MutationObserver(upd).observe(c,{childList:true,subtree:true});c.addEventListener("wheel",function(e){if(c.scrollWidth<=c.clientWidth||Math.abs(e.deltaX)>Math.abs(e.deltaY))return;var dir=getComputedStyle(c).direction==="rtl"?-1:1;c.scrollLeft+=e.deltaY*dir;e.preventDefault();},{passive:false});setTimeout(upd,300);})();
</script>
